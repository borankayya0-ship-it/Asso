name: Auto Generate and Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle and Android SDK tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle

      - name: Generate Android Project Structure & Files
        run: |
          mkdir -p app/src/main/java/com/example/voicecall
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 1. Root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF

          # 2. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VoiceCallApp"
          include ':app'
          EOF

          # 3. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.voicecall'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.voicecall"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

          # 4. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Voice Call P2P"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          # 5. strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Voice Call P2P</string>
          </resources>
          EOF

          # 6. activity_main.xml
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="24dp"
              android:gravity="center"
              android:background="#121212">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Gerçek Zamanlı Sesli Arama"
                  android:textColor="#FFFFFF"
                  android:textSize="22sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="32dp"/>

              <EditText
                  android:id="@+id/etMyNumber"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:hint="Kendi Sahte Numaranız"
                  android:textColor="#FFFFFF"
                  android:textColorHint="#888888"
                  android:inputType="phone"
                  android:padding="16dp"
                  android:background="#1E1E1E"
                  android:layout_marginBottom="16dp"/>

              <EditText
                  android:id="@+id/etTargetNumber"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:hint="Aranacak Arkadaşın Numarası"
                  android:textColor="#FFFFFF"
                  android:textColorHint="#888888"
                  android:inputType="phone"
                  android:padding="16dp"
                  android:background="#1E1E1E"
                  android:layout_marginBottom="24dp"/>

              <Button
                  android:id="@+id/btnConnect"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Bağlan ve Ara"
                  android:padding="16dp"
                  android:backgroundTint="#4CAF50"
                  android:textColor="#FFFFFF"
                  android:layout_marginBottom="12dp"/>

              <Button
                  android:id="@+id/btnDisconnect"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Aramayı Sonlandır"
                  android:padding="16dp"
                  android:backgroundTint="#F44336"
                  android:textColor="#FFFFFF"
                  android:visibility="gone"/>

              <TextView
                  android:id="@+id/tvStatus"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Durum: Bekleniyor..."
                  android:textColor="#AAAAAA"
                  android:textSize="16sp"
                  android:layout_marginTop="24dp"/>

          </LinearLayout>
          EOF

          # 7. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/example/voicecall/MainActivity.kt
          package com.example.voicecall

          import android.Manifest
          import android.content.pm.PackageManager
          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.AudioTrack
          import android.media.MediaRecorder
          import android.os.Bundle
          import android.widget.Button
          import android.widget.EditText
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import java.net.DatagramPacket
          import java.net.DatagramSocket
          import java.net.InetAddress
          import kotlin.concurrent.thread

          class MainActivity : AppCompatActivity() {

              private lateinit var etMyNumber: EditText
              private lateinit var etTargetNumber: EditText
              private lateinit var btnConnect: Button
              private lateinit var btnDisconnect: Button
              private lateinit var tvStatus: TextView

              private var isCallActive = false
              private val PORT = 50005
              private var socket: DatagramSocket? = null

              companion object {
                  private const val REQUEST_CODE_PERMISSIONS = 101
                  private const val SAMPLE_RATE = 8000
                  private const val CHANNEL_CONFIG = AudioFormat.CHANNEL_IN_MONO
                  private const val AUDIO_FORMAT = AudioFormat.ENCODING_PCM_16BIT
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  etMyNumber = findViewById(R.id.etMyNumber)
                  etTargetNumber = findViewById(R.id.etTargetNumber)
                  btnConnect = findViewById(R.id.btnConnect)
                  btnDisconnect = findViewById(R.id.btnDisconnect)
                  tvStatus = findViewById(R.id.tvStatus)

                  checkPermissions()

                  btnConnect.setOnClickListener {
                      val myNum = etMyNumber.text.toString().trim()
                      val targetNum = etTargetNumber.text.toString().trim()

                      if (myNum.isEmpty() || targetNum.isEmpty()) {
                          Toast.makeText(this, "Lütfen numaraları girin", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }

                      startCallSession()
                  }

                  btnDisconnect.setOnClickListener {
                      stopCallSession()
                  }
              }

              private fun checkPermissions() {
                  val permissions = arrayOf(
                      Manifest.permission.INTERNET,
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.ACCESS_NETWORK_STATE
                  )
                  if (permissions.any { ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED }) {
                      ActivityCompat.requestPermissions(this, permissions, REQUEST_CODE_PERMISSIONS)
                  }
              }

              private fun startCallSession() {
                  isCallActive = true
                  btnConnect.visibility = android.view.View.GONE
                  btnDisconnect.visibility = android.view.View.VISIBLE
                  tvStatus.text = "Durum: Arama başlatıldı, ses iletiliyor..."

                  thread {
                      try {
                          socket = DatagramSocket(PORT)
                          val bufferSize = AudioRecord.getMinBufferSize(SAMPLE_RATE, CHANNEL_CONFIG, AUDIO_FORMAT)

                          if (ActivityCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                              return@thread
                          }

                          val audioRecord = AudioRecord(
                              MediaRecorder.AudioSource.MIC,
                              SAMPLE_RATE,
                              CHANNEL_CONFIG,
                              AUDIO_FORMAT,
                              bufferSize
                          )

                          val audioTrack = AudioTrack.Builder()
                              .setAudioFormat(
                                  AudioFormat.Builder()
                                      .setEncoding(AUDIO_FORMAT)
                                      .setSampleRate(SAMPLE_RATE)
                                      .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                                      .build()
                              )
                              .setBufferSizeInBytes(bufferSize)
                              .build()

                          audioRecord.startRecording()
                          audioTrack.play()

                          val audioBuffer = ByteArray(bufferSize)

                          thread {
                              while (isCallActive) {
                                  val readSize = audioRecord.read(audioBuffer, 0, audioBuffer.size)
                                  if (readSize > 0) {
                                      try {
                                          val targetIp = InetAddress.getByName("127.0.0.1")
                                          val packet = DatagramPacket(audioBuffer, readSize, targetIp, PORT)
                                          socket?.send(packet)
                                      } catch (e: Exception) {
                                          e.printStackTrace()
                                      }
                                  }
                              }
                          }

                          val receiveBuffer = ByteArray(bufferSize)
                          while (isCallActive) {
                              val packet = DatagramPacket(receiveBuffer, receiveBuffer.size)
                              socket?.receive(packet)
                              audioTrack.write(packet.data, 0, packet.length)
                          }

                          audioRecord.stop()
                          audioRecord.release()
                          audioTrack.stop()
                          audioTrack.release()

                      } catch (e: Exception) {
                          e.printStackTrace()
                          runOnUiThread {
                              tvStatus.text = "Hata: ${e.message}"
                          }
                      }
                  }
              }

              private fun stopCallSession() {
                  isCallActive = false
                  socket?.close()
                  socket = null
                  btnConnect.visibility = android.view.View.VISIBLE
                  btnDisconnect.visibility = android.view.View.GONE
                  tvStatus.text = "Durum: Arama sonlandırıldı."
              }
          }
          EOF

      - name: Build APK with Gradle
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-call-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
